name: Build & Release woofish (Android)

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Android Release APK
        run: |
          if ! gradle :app:assembleRelease --stacktrace > android_build.log 2>&1; then
            cat android_build.log
            ERR_MSG=$(tail -n 30 android_build.log | tr -d '\r' | tr '\n' ' ' | cut -c 1-500)
            echo "::error title=AndroidBuildError::$ERR_MSG"
            exit 1
          fi

      - name: Upload Android Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android_build.log

      - name: Prepare APK Package
        id: prepare_apk
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VER="${{ github.ref_name }}"
            PURE_VER="${TAG_VER#v}"
          else
            TAG_VER="v1.3.3"
            PURE_VER="1.3.3"
          fi
          APK_NAME="woofish-${PURE_VER}.apk"
          FOUND_APK=$(find _Dist/android/ modules/android/build/outputs/apk/release/ build/ -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            cp "$FOUND_APK" "${APK_NAME}"
            echo "Found APK: $FOUND_APK -> ${APK_NAME}"
            ls -lh "${APK_NAME}"
          else
            echo "No APK found" && exit 1
          fi
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "tag_ver=${TAG_VER}" >> $GITHUB_OUTPUT
          echo "pure_ver=${PURE_VER}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Prepare Release Files
        id: prep_files
        run: |
          TAG_VER="${{ github.ref_name }}"
          PURE_VER="${TAG_VER#v}"
          mkdir -p release_dist
          find release_artifacts -type f -name "*.apk" -exec cp {} release_dist/ \;
          ls -lh release_dist/
          python3 scripts/extract_release_notes.py RELEASE_NOTES.md current_release_notes.md "${PURE_VER}"
          echo "tag_ver=${TAG_VER}" >> $GITHUB_OUTPUT
          echo "pure_ver=${PURE_VER}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "woofish-${{ steps.prep_files.outputs.pure_ver }}"
          tag_name: ${{ steps.prep_files.outputs.tag_ver }}
          files: release_dist/*
          body_path: current_release_notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

